<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla de Comportamiento Semanal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #f0f9ff; /* A light, friendly sky blue */
      }
      .child-card-enter {
        animation: slide-up 0.5s ease-out both;
      }
      .toast-anim {
        animation: slide-in-right 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
      }
      .toast-exit {
        animation: fade-out-right 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-in-out both;
      }

      @keyframes slide-up {
        0% { transform: translateY(20px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes slide-in-right {
        0% { transform: translateX(100px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes fade-out-right {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(50px); opacity: 0; }
      }
      @keyframes fade-in {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
    </style>
